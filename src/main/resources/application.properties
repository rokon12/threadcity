spring.application.name=threadcity
server.port=${PORT:8080}
vaadin.launch-browser=false
spring.servlet.multipart.max-file-size=48MB
spring.servlet.multipart.max-request-size=49MB
server.shutdown=graceful
threadcity.ai.enabled=${THREADCITY_AI_ENABLED:true}
threadcity.ai.provider=${THREADCITY_AI_PROVIDER:none}
threadcity.ai.api-key=${OPENAI_API_KEY:}
threadcity.ai.model=${THREADCITY_AI_MODEL:gpt-4.1-mini}
threadcity.ai.limits.session-daily=${THREADCITY_AI_SESSION_DAILY_LIMIT:6}
threadcity.ai.limits.network-hourly=${THREADCITY_AI_NETWORK_HOURLY_LIMIT:12}
threadcity.ai.limits.global-daily=${THREADCITY_AI_GLOBAL_DAILY_LIMIT:100}
threadcity.ai.limits.concurrent=${THREADCITY_AI_CONCURRENT_LIMIT:2}
threadcity.ai.limits.state-file=${THREADCITY_AI_USAGE_FILE:}
threadcity.ai.kill-switch-file=${THREADCITY_AI_KILL_SWITCH_FILE:}
