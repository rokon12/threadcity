name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify ThreadCity production build
        run: mvn -B -Pproduction verify
      - name: Verify collector
        working-directory: threadcity-collector
        run: mvn -B verify
      - name: Verify failure lab
        working-directory: threadcity-lab
        run: mvn -B verify
